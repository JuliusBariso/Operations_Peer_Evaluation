<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabaco CDRRMO Peer Evaluation Form</title>
    <style>
        :root {
            --primary-color: #1e40af; /* Corporate Blue */
            --primary-dark: #1e3a8a;  /* Dark Blue */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .logo-container img {
            max-height: 75px;
            width: auto;
            display: block;
        }

        .header {
            flex-grow: 1;
        }

        .header h1 { font-size: 1.5rem; color: var(--primary-dark); text-transform: uppercase; letter-spacing: 0.5px; }
        .header h2 { font-size: 1.1rem; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
            background: var(--bg-color);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input[type="text"], .form-group input[type="date"], .form-group input[type="email"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
        }

        .scale-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.95rem;
            text-align: center;
        }

        .section-title {
            background: var(--primary-color);
            color: white;
            padding: 8px 14px;
            font-size: 1.05rem;
            border-radius: 6px;
            margin: 28px 0 14px 0;
            text-transform: uppercase;
            font-weight: 600;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }

        .matrix-table th, .matrix-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .matrix-table th {
            background-color: var(--bg-color);
            font-weight: 600;
            color: var(--text-muted);
        }

        .matrix-table td.radio-cell {
            text-align: center;
            width: 60px;
        }

        .matrix-table tr:nth-child(even) {
            background-color: #fafafa;
        }

        input[type="radio"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .mobile-question-card {
            display: none;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 12px;
        }

        button {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.2s;
            box-shadow: 0 4px 6px -1px rgba(30, 64, 175, 0.4);
        }

        button:hover { background-color: var(--primary-dark); }

        @media (max-width: 650px) {
            .header-wrapper { flex-direction: column; text-align: center; }
            .meta-grid { grid-template-columns: 1fr; }
            .matrix-table { display: none; }
            
            .mobile-question-card {
                display: block;
                background: #fff;
                border: 1px solid var(--border-color);
                border-radius: 8px;
                padding: 14px;
                margin-bottom: 14px;
            }

            .mobile-question-text {
                font-weight: 600;
                margin-bottom: 12px;
                font-size: 1rem;
            }

            .mobile-radio-options {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--bg-color);
                padding: 10px;
                border-radius: 6px;
            }

            .mobile-option {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                font-size: 0.9rem;
                font-weight: 600;
                color: var(--text-muted);
                cursor: pointer;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-wrapper">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="header">
            <h1>Tabaco CDRRMO Peer Evaluation Form</h1>
            <h2>Operations Personnel</h2>
        </div>
    </div>

    <form id="evaluationForm">
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="submissionEmail">Designated Recipient Email:</label>
            <input type="email" id="submissionEmail" value="gelmolatojunior@gmail.com" required>
        </div>

        <div class="meta-grid">
            <div class="form-group">
                <label for="empName">Name of Person Being Evaluated</label>
                <input type="text" id="empName" required>
            </div>
            <div class="form-group">
                <label for="position">Designation</label>
                <input type="text" id="position" required>
            </div>
            <div class="form-group">
                <label for="evaluatorName">Evaluator’s Name (Optional)</label>
                <input type="text" id="evaluatorName" placeholder="Anonymous">
            </div>
            <div class="form-group">
                <label for="evalDate">Date</label>
                <input type="date" id="evalDate" required>
            </div>
        </div>

        <div class="scale-box">
            <strong>Instructions:</strong> Rate your peer using the following scale:<br>
            5 – Excellent | 4 – Very Good | 3 – Good | 2 – Fair | 1 – Poor
        </div>

        <div id="dynamicSections"></div>

        <div class="section-title">G. Comments and Recommendations</div>
        <div class="form-group">
            <label for="improvements">Areas for Improvement:</label>
            <textarea id="improvements" rows="4" placeholder="Provide operational areas needing improvement..."></textarea>
            
            <label for="recommendations">Recommendations:</label>
            <textarea id="recommendations" rows="4" placeholder="Provide direct action plans or recommendations..."></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>
</div>

<script>
    const formSchema = [
        {
            title: "A. Professionalism and Work Ethics",
            key: "PWE",
            questions: [
                { id: 1, text: "Reports for duty on time and prepared for assignments." },
                { id: 2, text: "Demonstrates honesty and integrity in all situations." },
                { id: 3, text: "Shows respect to victims, patients, colleagues, and the public." },
                { id: 4, text: "Maintains proper uniform and grooming." },
                { id: 5, text: "Follows rules, policies, and standard operating procedures." }
            ]
        },
        {
            title: "B. Response Skills and Competence",
            key: "RSC",
            questions: [
                { id: 6, text: "Responds promptly and efficiently to emergencies." },
                { id: 7, text: "Demonstrates competence in first aid and emergency care." },
                { id: 8, text: "Makes sound decisions under pressure." },
                { id: 9, text: "Handles emergency equipment properly and effectively." },
                { id: 10, text: "Maintains composure during critical incidents." }
            ]
        },
        {
            title: "C. Teamwork and Communication",
            key: "TWC",
            questions: [
                { id: 11, text: "Communicates clearly with team members during operations." },
                { id: 12, text: "Cooperates and supports fellow responders." },
                { id: 13, text: "Shows willingness to assist beyond assigned duties." },
                { id: 14, text: "Accepts feedback and suggestions positively." },
                { id: 15, text: "Demonstrates leadership when necessary." }
            ]
        },
        {
            title: "D. Safety and Vehicle Operations",
            key: "SVO",
            questions: [
                { id: 16, text: "Drives safely and responsibly during emergency and non-emergency situations." },
                { id: 17, text: "Ensures ambulance is clean, functional, and ready for deployment." },
                { id: 18, text: "Observes traffic rules while prioritizing patient safety." },
                { id: 19, text: "Conducts routine vehicle checks before and after use." },
                { id: 20, text: "Ensures proper handling and transport of patients." }
            ]
        },
        {
            title: "E. Discipline and Reliability",
            key: "DAR",
            questions: [
                { id: 21, text: "Follows chain of command and respects authority." },
                { id: 22, text: "Can be relied upon during critical operations." },
                { id: 23, text: "Maintains focus and avoids distractions while on duty." },
                { id: 24, text: "Handles conflicts professionally." },
                { id: 25, text: "Demonstrates accountability for actions and decisions." }
            ]
        },
        {
            title: "F. Overall Performance",
            key: "OP",
            questions: [
                { id: 26, text: "Overall performance." }
            ]
        }
    ];

    function getDescriptiveRating(score) {
        if (score === 0) return "Incomplete";
        if (score >= 4.50) return "Outstanding";
        if (score >= 3.50) return "Very Satisfactory";
        if (score >= 2.50) return "Satisfactory";
        if (score >= 1.50) return "Needs Improvement";
        return "Poor";
    }

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('evalDate').value = today;

    const targetContainer = document.getElementById('dynamicSections');

    formSchema.forEach(section => {
        let sectionHTML = `<div class="section-title">${section.title}</div>`;
        
        // Desktop Layout Table View
        sectionHTML += `<table class="matrix-table">
            <thead>
                <tr>
                    <th>Evaluation Criteria</th>
                    <th style="text-align:center">1</th>
                    <th style="text-align:center">2</th>
                    <th style="text-align:center">3</th>
                    <th style="text-align:center">4</th>
                    <th style="text-align:center">5</th>
                </tr>
            </thead>
            <tbody>`;

        section.questions.forEach(q => {
            sectionHTML += `<tr>
                <td>${q.id}. ${q.text}</td>`;
                for(let i=1; i<=5; i++) {
                    sectionHTML += `<td class="radio-cell">
                        <input type="radio" name="q_${q.id}" id="desktop_q_${q.id}_${i}" value="${i}" data-text="${q.text}" required>
                    </td>`;
                }
            sectionHTML += `</tr>`;
        });
        sectionHTML += `</tbody></table>`;

        // Isolated Mobile Layout Card View
        section.questions.forEach(q => {
            sectionHTML += `<div class="mobile-question-card">
                <div class="mobile-question-text">${q.id}. ${q.text}</div>
                <div class="mobile-radio-options">`;
                for(let i=1; i<=5; i++) {
                    sectionHTML += `<label class="mobile-option" for="mobile_q_${q.id}_${i}">
                        <span>${i}</span>
                        <input type="radio" name="m_q_${q.id}" id="mobile_q_${q.id}_${i}" value="${i}" data-sync="q_${q.id}">
                    </label>`;
                }
            sectionHTML += `</div></div>`;
        });

        targetContainer.innerHTML += sectionHTML;
    });

    // Cross-Synchronization Interactivity Layer (Fixed to avoid bleed-through selecting)
    document.addEventListener('change', function(e) {
        if(e.target.name.startsWith('q_')) {
            const questionId = e.target.name.split('_')[1];
            const mobileRadio = document.getElementById(`mobile_q_${questionId}_${e.target.value}`);
            if(mobileRadio) mobileRadio.checked = true;
        }
        if(e.target.name.startsWith('m_q_')) {
            const questionId = e.target.name.split('_')[2];
            const desktopRadio = document.getElementById(`desktop_q_${questionId}_${e.target.value}`);
            if(desktopRadio) {
                desktopRadio.checked = true;
                desktopRadio.setCustomValidity(""); 
            }
        }
    });

    document.getElementById('evaluationForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const sendTo = document.getElementById('submissionEmail').value;
        const targetEmp = document.getElementById('empName').value;
        const targetPos = document.getElementById('position').value;
        const targetDate = document.getElementById('evalDate').value;
        const improvementsText = document.getElementById('improvements').value || 'None provided';
        const recommendationsText = document.getElementById('recommendations').value || 'None provided';
        const evaluator = document.getElementById('evaluatorName').value || 'Anonymous';

        let totalScoreSum = 0;
        let countedQuestions = 0;

        // Score Compile Mapping Logic
        formSchema.forEach(section => {
            section.questions.forEach(q => {
                const checkedRadio = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if (checkedRadio) {
                    totalScoreSum += parseFloat(checkedRadio.value);
                    countedQuestions++;
                }
            });
        });

        const finalAverageScore = countedQuestions > 0 ? (totalScoreSum / countedQuestions) : 0;
        const finalPercentageScore = finalAverageScore > 0 ? ((finalAverageScore / 5) * 100) : 0;
        const finalDescriptiveRating = getDescriptiveRating(finalAverageScore);

        let trackingBody = `TABACO CDRRMO OPERATIONS PERSONNEL PEER PERFORMANCE EVALUATION REPORT\n`;
        trackingBody += `==================================================\n`;
        trackingBody += `OVERALL SCORE RATING      : ${finalAverageScore.toFixed(2)} / 5.00 (${Math.round(finalPercentageScore)}%)\n`;
        trackingBody += `OVERALL PERFORMANCE RATING : ${finalDescriptiveRating}\n`;
        trackingBody += `==================================================\n\n`;
        
        trackingBody += `PERSON BEING EVALUATED    : ${targetEmp}\n`;
        trackingBody += `DESIGNATION               : ${targetPos}\n`;
        trackingBody += `EVALUATION DATE           : ${targetDate}\n`;
        trackingBody += `EVALUATOR PROFILE         : ${evaluator}\n\n`;
        
        trackingBody += `==================================================\n`;
        trackingBody += `CRITERIA METRICS RUNNING LOG:\n`;
        trackingBody += `==================================================\n\n`;

        formSchema.forEach(section => {
            trackingBody += `--- ${section.title} ---\n`;
            section.questions.forEach(q => {
                const selectedRadio = document.querySelector(`input[name="q_${q.id}"]:checked`);
                const selectedVal = selectedRadio ? selectedRadio.value : "0";
                trackingBody += `Item ${q.id}: [Score: ${selectedVal}] - ${q.text}\n`;
            });
            trackingBody += `\n`;
        });

        trackingBody += `==================================================\n`;
        trackingBody += `G. COMMENTS AND RECOMMENDATIONS:\n`;
        trackingBody += `==================================================\n`;
        trackingBody += `Areas for Improvement:\n${improvementsText}\n\n`;
        trackingBody += `Recommendations:\n${recommendationsText}\n`;

        const subjectLine = `Ops Peer Evaluation [Score: ${finalAverageScore.toFixed(2)} - ${finalDescriptiveRating}] - ${targetEmp}`;

        window.location.href = `mailto:${sendTo}?subject=${encodeURIComponent(subjectLine)}&body=${encodeURIComponent(trackingBody)}`;
    });
</script>

</body>
</html>
